# Test-only JWT secret — base64 of "test-jwt-signing-secret-for-unit-tests-only" (43 bytes, > 32 required for HS256).
# This overrides the ${JWT_SECRET} env-var requirement so full-context @SpringBootTest classes
# (e.g. SchemaMigrationTest, AuthIntegrationTest) can start without a local .env file.
jwt.secret=dGVzdC1qd3Qtc2lnbmluZy1zZWNyZXQtZm9yLXVuaXQtdGVzdHMtb25seQ==

# Test-only Cloudinary stubs (Phase 17) — dummy values allow CloudinaryConfig bean to be
# created in @SpringBootTest integration tests without CLOUDINARY_* env vars.
# CloudinaryService is @MockitoBean in @WebMvcTest slices; these stubs cover full-context tests.
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret
