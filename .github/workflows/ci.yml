name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run backend tests (Testcontainers)
        run: mvn verify -B
        # ubuntu-latest has Docker pre-installed.
        # Testcontainers auto-detects /var/run/docker.sock — no DinD setup needed.
        # -B = batch mode (no colour codes, clean CI output)

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (TypeScript + Vite)
        working-directory: frontend
        run: npm run build
        # npm run build = tsc -b && vite build (see frontend/package.json)
        # TypeScript errors fail the build; serves as type-check gate

      - name: Deploy to Render
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail -X POST "$RENDER_DEPLOY_HOOK_URL"

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booktracker_e2e
          POSTGRES_USER: bt_e2e
          POSTGRES_PASSWORD: bt_e2e_pw
        options: >-
          --health-cmd "pg_isready -U bt_e2e -d booktracker_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build fat JAR (skip tests — verified in ci job)
        # Backend tests already verified in the ci job — skipping here to save CI minutes.
        run: mvn -DskipTests package -B -q

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: e2e
        env:
          CI: "true"
          E2E_DB_URL: jdbc:postgresql://localhost:5432/booktracker_e2e
          E2E_DB_USER: bt_e2e
          E2E_DB_PASS: bt_e2e_pw
          E2E_JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}
          # E2E_JWT_SECRET must be a test-only JWT secret — never the production JWT_SECRET.
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
